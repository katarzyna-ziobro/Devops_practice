name: CI/CD workflow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  Lint-tests:
# Lint test - frontend 
    runs-on: ubuntu-latest

    steps:
    - name: Chekout repository
      uses: actions/checkout@v7

    - name: Lint test - frontend 
      uses: actions/setup-node@v7
      with: 
        node-version: 24
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

 

